<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Lamp post -->
  <rect x="350" y="100" width="8" height="200" fill="#333"/>
  <circle cx="354" cy="100" r="25" fill="#444" stroke="#666" stroke-width="2"/>
  <circle cx="354" cy="100" r="15" fill="url(#lampGlow)"/>
  
  <!-- Lamp light effect -->
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fff59d;stop-opacity:0.2" />
    </radialGradient>
    <radialGradient id="lightCone" cx="50%" cy="0%" r="100%">
      <stop offset="0%" style="stop-color:#fff59d;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffeb3b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#fff59d;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Light cone -->
  <ellipse cx="354" cy="300" rx="120" ry="200" fill="url(#lightCone)"/>
  
  <!-- Bench -->
  <rect x="200" y="350" width="300" height="15" rx="5" fill="#8b4513"/>
  <rect x="210" y="340" width="280" height="8" rx="3" fill="#a0522d"/>
  
  <!-- Bench legs -->
  <rect x="220" y="365" width="12" height="40" fill="#654321"/>
  <rect x="270" y="365" width="12" height="40" fill="#654321"/>
  <rect x="420" y="365" width="12" height="40" fill="#654321"/>
  <rect x="470" y="365" width="12" height="40" fill="#654321"/>
  
  <!-- Ground -->
  <rect x="0" y="400" width="800" height="200" fill="#1a1a1a"/>
  
  <!-- Shadows -->
  <ellipse cx="350" cy="420" rx="80" ry="15" fill="#000" opacity="0.3"/>
  
  <!-- Atmospheric fog -->
  <circle cx="100" cy="300" r="60" fill="#333" opacity="0.1"/>
  <circle cx="600" cy="250" r="80" fill="#333" opacity="0.08"/>
  <circle cx="400" cy="500" r="100" fill="#222" opacity="0.05"/>
</svg>