<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="phantomFog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(147,112,219,0.3);stop-opacity:1" />
      <stop offset="30%" style="stop-color:rgba(64,224,208,0.2);stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:rgba(147,112,219,0.1);stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:rgba(64,224,208,0.05);stop-opacity:0" />
    </radialGradient>
    
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>
  
  <!-- Main fog cloud -->
  <circle cx="100" cy="100" r="80" fill="url(#phantomFog)" filter="url(#blur)" opacity="0.7"/>
  
  <!-- Additional fog wisps -->
  <ellipse cx="120" cy="80" rx="40" ry="25" fill="rgba(147,112,219,0.2)" filter="url(#blur)" opacity="0.5"/>
  <ellipse cx="80" cy="120" rx="35" ry="20" fill="rgba(64,224,208,0.15)" filter="url(#blur)" opacity="0.6"/>
  <ellipse cx="60" cy="70" rx="25" ry="15" fill="rgba(147,112,219,0.25)" filter="url(#blur)" opacity="0.4"/>
  <ellipse cx="140" cy="130" rx="30" ry="18" fill="rgba(64,224,208,0.2)" filter="url(#blur)" opacity="0.5"/>
</svg>