<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnonX Chat</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="online-count" id="onlineCount" style="display:none;">Online: 0</div>
  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-bubble">
      <div class="loading-text">Looking for a partner...</div>
    </div>
  </div>
  <div id="mainPage" class="centered">
    <div class="glow">AnonX Chat</div>
    <button class="start-btn" id="startBtn">Start Chat</button>
    <div class="sound-toggle-container">
      <button class="sound-toggle" id="soundToggle" title="Toggle sound effects">
        <span class="sound-icon" id="soundIcon">🔊</span>
        <span class="sound-text">Sound ON</span>
      </button>
    </div>
  </div>
  <div id="chatPage" class="chat-container">
    <div class="messages" id="messages"></div>
    <div id="typingIndicator" class="typing-indicator" style="display:none;">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
    <form id="chatForm" autocomplete="off">
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..." autocomplete="off" maxlength="500"/>
        <button type="submit" class="send-btn">Send</button>
      </div>
    </form>
  <div class="chat-actions">
    <button type="button" class="skip-btn" id="skipBtn">Skip</button>
    <button type="button" class="end-btn" id="endBtn">End Chat</button>
</div>
  </div>
  <div id="notification" style="display:none;">
    <div class="notif" id="notifMsg"></div>
    <div class="notif-btns" id="notifBtns" style="display:none;">
      <button class="notif-btn" id="continueBtn">Find New Partner</button>
      <button class="notif-btn" id="returnBtn">Go Back</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
