<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnonX Chat</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #23272f;
      color: #fff;
      min-height: 100vh;
    }
    .glow {
      font-size: 2.7rem;
      font-weight: 700;
      text-align: center;
      margin-top: 40px;
      color: #fff;
      text-shadow: 0 0 12px #5eead4, 0 0 2px #fff;
      letter-spacing: 2px;
      transition: text-shadow 0.4s;
    }
    .online-count {
      position: absolute;
      top: 30px;
      right: 30px;
      background: rgba(60,80,100,0.2);
      padding: 8px 18px;
      border-radius: 1.3rem;
      font-size: 1.15rem;
      color: #aeefff;
      font-weight: 500;
      box-shadow: 0 0 4px #222;
    }
    .centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .start-btn {
      margin-top: 60px;
      padding: 20px 65px;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 2.2rem;
      border: none;
      background: linear-gradient(90deg,#56d6fa,#62f1d4);
      color: #23272f;
      box-shadow: 0 4px 22px #5eead4bb;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 32px #5eead4ee;
    }
    .chat-container {
      display: none;
      flex-direction: column;
      height: 88vh;
      max-width: 600px;
      margin: 0 auto;
      background: rgba(30,34,40,0.9);
      border-radius: 2.3rem;
      box-shadow: 0 8px 40px #1e293b99;
      padding: 30px 12px 14px 12px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 18px 12px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 13px 22px;
      border-radius: 1.7rem;
      margin-bottom: 0;
      position: relative;
      word-break: break-word;
      font-size: 1.15rem;
      box-shadow: 0 1px 8px #10141b55;
      animation: bounce-in 0.2s;
      transition: background 0.2s, color 0.2s;
      display: inline-block;
      white-space: pre-wrap;
    }
    .msg-right {
      align-self: flex-end;
      background: linear-gradient(100deg,#54ffe0,#46c2fc);
      color: #23272f;
    }
    .msg-left {
      align-self: flex-start;
      background: linear-gradient(100deg,#292f38,#353a43);
      color: #fff;
    }
    .msg-time {
      display: inline-block;
      font-size: 0.89rem;
      color: #c0d0d9;
      margin-left: 10px;
      margin-top: 2px;
      vertical-align: middle;
      float: right;
      font-weight: 400;
    }
    .typing-indicator {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
    }
    .typing-dot {
      width: 10px;
      height: 10px;
      background: #5eead4;
      border-radius: 50%;
      display: inline-block;
      opacity: 0.8;
      animation: blink 1.2s infinite both;
    }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%,100% { opacity: .3;}
      50% { opacity: 1;}
    }
    @keyframes bounce-in {
      0% { transform: scale(0.7) translateY(20px);}
      100% { transform: scale(1) translateY(0);}
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      padding: 14px;
      font-size: 1.1rem;
      border-radius: 1.3rem;
      border: none;
      background: #29303b;
      color: #fff;
      outline: none;
    }
    .send-btn {
      padding: 13px 20px;
      border-radius: 1.3rem;
      border: none;
      font-weight: 700;
      background: linear-gradient(90deg,#5eead4,#56d6fa);
      color: #23272f;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 2px 7px #5eead455;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .send-btn:hover { transform: scale(1.08);}
    .notif {
      margin: 20px auto 0 auto;
      padding: 17px 23px;
      background: #181e24e0;
      border-radius: 1.5rem;
      color: #fff;
      font-size: 1.2rem;
      box-shadow: 0 1px 6px #5eead444;
      text-align: center;
      font-weight: 500;
    }
    .notif-btns {
      margin-top: 17px;
      display: flex;
      gap: 18px;
      justify-content: center;
    }
    .notif-btn {
      padding: 12px 29px;
      border-radius: 1.1rem;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg,#56d6fa,#62f1d4);
      color: #23272f;
      transition: box-shadow 0.18s;
      box-shadow: 0 2px 9px #5eead4aa;
    }
    .notif-btn:hover { box-shadow: 0 2px 18px #5eead4ee; }
    /* Responsive */
    @media (max-width: 700px) {
      .chat-container {max-width:98vw; border-radius:1.2rem; padding:10px 2px 8px 2px;}
      .messages {padding: 0 3px 10px 3px;}
    }
  </style>
</head>
<body>
  <div class="online-count" id="onlineCount" style="display:none;">Online: 0</div>
  <div id="mainPage" class="centered">
    <div class="glow">AnonX Chat</div>
    <button class="start-btn" id="startBtn">Start Chat</button>
  </div>
  <div id="chatPage" class="chat-container">
    <div class="messages" id="messages"></div>
    <div id="typingIndicator" class="typing-indicator" style="display:none;">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
    <form id="chatForm" autocomplete="off">
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..." autocomplete="off" maxlength="500"/>
        <button type="submit" class="send-btn">Send</button>
      </div>
    </form>
  </div>
  <div id="notification" style="display:none;">
    <div class="notif" id="notifMsg"></div>
    <div class="notif-btns" id="notifBtns" style="display:none;">
      <button class="notif-btn" id="continueBtn">Continue</button>
      <button class="notif-btn" id="returnBtn">Return</button>
    </div>
  </div>

  <!-- SOCKET.IO + LOGIKA -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // Setup proměnných
    let socket;
    let mySide = 'right';
    let partnerActive = true;
    let typingTimeout;
    let online = 0;

    // Helper na čas
    function getTimeNow() {
      let d = new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Přepínání stránek
    function showChatPage() {
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('chatPage').style.display = 'flex';
      document.getElementById('onlineCount').style.display = '';
      document.getElementById('notification').style.display = 'none';
    }
    function showMainPage() {
      document.getElementById('mainPage').style.display = 'flex';
      document.getElementById('chatPage').style.display = 'none';
      document.getElementById('notification').style.display = 'none';
    }
    function showNotif(msg, btns = false) {
      document.getElementById('notifMsg').textContent = msg;
      document.getElementById('notification').style.display = '';
      document.getElementById('notifBtns').style.display = btns ? '' : 'none';
      document.getElementById('chatPage').style.display = 'none';
      document.getElementById('mainPage').style.display = 'none';
    }

    // Přidání zprávy
    function addMsg(text, side, time) {
      const el = document.createElement('div');
      el.className = 'msg-bubble msg-' + side;
      el.innerHTML = text + '<span class="msg-time">' + (time || getTimeNow()) + '</span>';
      document.getElementById('messages').appendChild(el);
      document.getElementById('messages').scrollTop = 99999;
    }

    // Odeslání zprávy
    function sendMsg() {
      const inp = document.getElementById('chatInput');
      const text = inp.value.trim();
      if (!text) return;
      addMsg(text, mySide);
      socket.emit('msg', text);
      inp.value = '';
    }

    // START BTN
    document.getElementById('startBtn').onclick = function() {
      showChatPage();
      startSocket();
    }

    // CHAT FORM SUBMIT
    document.getElementById('chatForm').onsubmit = function(e) {
      e.preventDefault();
      sendMsg();
    };

    // CONTINUE/RETURN BTN
    document.getElementById('continueBtn').onclick = function() {
      showNotif('Looking for a new partner...');
      setTimeout(()=>location.reload(),800); // Prototypově reload (v ostré verzi lepší řešení)
    };
    document.getElementById('returnBtn').onclick = function() {
      showMainPage();
      setTimeout(()=>location.reload(),500); // Reload pro návrat na čistou homepage
    };

    // SOCKET.IO
    function startSocket() {
      socket = io(); // Automaticky na stejný server
      socket.on('connect', ()=> {
        addMsg('⏳ Looking for a partner...', mySide);
      });
      socket.on('online', (count)=>{
        online = count;
        document.getElementById('onlineCount').textContent = "Online: " + count;
      });
      socket.on('partner', ()=> {
        addMsg('✅ Partner found!', mySide);
      });
      socket.on('msg', (data)=>{
        addMsg(data, mySide==='right' ? 'left' : 'right');
      });
      socket.on('typing', ()=> {
        document.getElementById('typingIndicator').style.display = '';
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(()=> {
          document.getElementById('typingIndicator').style.display = 'none';
        }, 2000);
      });
      socket.on('partner_left', ()=> {
        showNotif('Partner has left the chat.', true);
        partnerActive = false;
      });
      socket.on('disconnect', ()=> {
        showNotif('Disconnected from server.', false);
      });

      // Indikace psaní
      document.getElementById('chatInput').addEventListener('input', ()=>{
        if (partnerActive) socket.emit('typing');
      });
    }
  </script>
</body>
</html>
