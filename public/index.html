<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnonX Chat</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="online-count" id="onlineCount" style="display:none;"><span data-translate="online">Online</span>: 0</div>
  <div class="language-switcher" id="languageSwitcher" data-translate-title="switchLanguage" title="Změnit jazyk">
    <span class="language-icon" id="languageIcon">🇨🇿</span>
  </div>
  <div class="theme-switcher" id="themeSwitcher" data-translate-title="switchTheme" title="Změnit téma">
    <span class="theme-icon" id="themeIcon">👻</span>
  </div>
  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-bubble">
      <div class="loading-text" data-translate="lookingForPartner">Hledám partnera...</div>
    </div>
  </div>
  <div id="mainPage" class="centered">
    <div class="glow" data-translate="appTitle">AnonX Chat</div>
    <button class="start-btn" id="startBtn" data-translate="startChat">Začít chat</button>
    <div class="sound-toggle-container">
      <button class="sound-toggle" id="soundToggle" data-translate-title="soundOn" title="Zvuk ZAP">
        <span class="sound-icon" id="soundIcon">🔊</span>
        <span class="sound-text" data-translate="soundOn">Zvuk ZAP</span>
      </button>
    </div>
  </div>
  <div id="chatPage" class="chat-container">
    <div class="messages" id="messages"></div>
    <div id="typingIndicator" class="typing-indicator" style="display:none;">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
    <form id="chatForm" autocomplete="off">
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chatInput" data-translate="messageInput" placeholder="Napište zprávu..." autocomplete="off" maxlength="500"/>
        <button type="submit" class="send-btn" data-translate="sendButton">Odeslat</button>
      </div>
    </form>
  <div class="chat-actions">
    <button type="button" class="skip-btn" id="skipBtn" data-translate="skipButton">Přeskočit</button>
    <button type="button" class="end-btn" id="endBtn" data-translate="endButton">Ukončit chat</button>
</div>
  </div>
  <div id="notification" style="display:none;">
    <div class="notif" id="notifMsg"></div>
    <div class="notif-btns" id="notifBtns" style="display:none;">
      <button class="notif-btn" id="continueBtn" data-translate="findNewPartner">Najít nového partnera</button>
      <button class="notif-btn" id="returnBtn" data-translate="goBack">Zpět</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="translations.js"></script>
  <script src="chat.js"></script>
</body>
</html>
